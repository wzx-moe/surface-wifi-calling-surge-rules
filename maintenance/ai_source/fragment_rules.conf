# Reference only. The delivered main .conf already integrates these entries.
# The public GitHub paths below become available after you deploy the package.
# Put the Claude rules before OpenAI's retained shared auth0.com suffix.
# Antigravity process routing, if used on macOS, must precede generic GitHub rules.
RULE-SET,https://raw.githubusercontent.com/wzx-moe/surface-wifi-calling-surge-rules/main/outputs/surge_ai/Claude.list,"🧸 Claude",extended-matching,no-resolve,update-interval=86400
IP-ASN,399358,"🧸 Claude",no-resolve
RULE-SET,https://raw.githubusercontent.com/wzx-moe/surface-wifi-calling-surge-rules/main/outputs/surge_ai/OpenAI.list,"🧸 OpenAI",extended-matching,no-resolve,update-interval=86400
# Sukka also contains Anthropic AS399358, already caught above.
# Keep the voice IP source separate and restrict it to OpenAI's documented UDP 3478 transport.
AND,((PROTOCOL,UDP),(DEST-PORT,3478),(RULE-SET,https://ruleset.skk.moe/List/ip/ai.conf,no-resolve)),🧸 OpenAI
RULE-SET,https://raw.githubusercontent.com/wzx-moe/surface-wifi-calling-surge-rules/main/outputs/surge_ai/Antigravity.list,"🧸 Google AI",extended-matching,no-resolve,update-interval=86400
