# Standalone Surge 5 full config for Wi-Fi Calling
# If you merge this into an existing config, copy the [Proxy Group] and [Rule] blocks only and keep them above broad rules.

[General]
loglevel = notify
include-all-networks = true
include-cellular-services = true

[Proxy Group]
VoWiFi-Global 🌐 = select, include-all-proxies=true
VoWiFi-US 🇺🇸 = select, include-all-proxies=true
VoWiFi-JP 🇯🇵 = select, include-all-proxies=true
VoWiFi-KR 🇰🇷 = select, include-all-proxies=true
VoWiFi-HK 🇭🇰 = select, include-all-proxies=true
VoWiFi-TW 🇹🇼 = select, include-all-proxies=true
VoWiFi-SG 🇸🇬 = select, include-all-proxies=true
VoWiFi-CA 🇨🇦 = select, include-all-proxies=true
VoWiFi-GB 🇬🇧 = select, include-all-proxies=true
VoWiFi-DE 🇩🇪 = select, include-all-proxies=true
VoWiFi-FR 🇫🇷 = select, include-all-proxies=true
VoWiFi-AU 🇦🇺 = select, include-all-proxies=true
VoWiFi-NL 🇳🇱 = select, include-all-proxies=true
VoWiFi-NZ 🇳🇿 = select, include-all-proxies=true
VoWiFi-UA 🇺🇦 = select, include-all-proxies=true
VoWiFi-IN 🇮🇳 = select, include-all-proxies=true
VoWiFi-IT 🇮🇹 = select, include-all-proxies=true
VoWiFi-ES 🇪🇸 = select, include-all-proxies=true
VoWiFi-MX 🇲🇽 = select, include-all-proxies=true
VoWiFi-BR 🇧🇷 = select, include-all-proxies=true

[Rule]
RULE-SET,SYSTEM,DIRECT
RULE-SET,LAN,DIRECT

RULE-SET,rulesets/WiFiCalling-US.list,VoWiFi-US 🇺🇸,no-resolve,extended-matching
RULE-SET,rulesets/WiFiCalling-JP.list,VoWiFi-JP 🇯🇵,no-resolve,extended-matching
RULE-SET,rulesets/WiFiCalling-KR.list,VoWiFi-KR 🇰🇷,no-resolve,extended-matching
RULE-SET,rulesets/WiFiCalling-HK.list,VoWiFi-HK 🇭🇰,no-resolve,extended-matching
RULE-SET,rulesets/WiFiCalling-TW.list,VoWiFi-TW 🇹🇼,no-resolve,extended-matching
RULE-SET,rulesets/WiFiCalling-SG.list,VoWiFi-SG 🇸🇬,no-resolve,extended-matching
RULE-SET,rulesets/WiFiCalling-CA.list,VoWiFi-CA 🇨🇦,no-resolve,extended-matching
RULE-SET,rulesets/WiFiCalling-GB.list,VoWiFi-GB 🇬🇧,no-resolve,extended-matching
RULE-SET,rulesets/WiFiCalling-DE.list,VoWiFi-DE 🇩🇪,no-resolve,extended-matching
RULE-SET,rulesets/WiFiCalling-FR.list,VoWiFi-FR 🇫🇷,no-resolve,extended-matching
RULE-SET,rulesets/WiFiCalling-AU.list,VoWiFi-AU 🇦🇺,no-resolve,extended-matching
RULE-SET,rulesets/WiFiCalling-NL.list,VoWiFi-NL 🇳🇱,no-resolve,extended-matching
RULE-SET,rulesets/WiFiCalling-NZ.list,VoWiFi-NZ 🇳🇿,no-resolve,extended-matching
RULE-SET,rulesets/WiFiCalling-UA.list,VoWiFi-UA 🇺🇦,no-resolve,extended-matching
